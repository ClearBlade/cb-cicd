name: Sync ClearBlade Resources
description: Syncs ClearBlade platform resources to a target system using cb-cicd

inputs:
  dir:
    description: Working directory (cblib system root) to run cb-cicd from
    required: false
    default: '.'
  config:
    description: Path to cicd-config.json (relative to dir)
    required: false
    default: ./cicd-config.json
  files:
    description: >-
      Space-separated list of -file flags to pass to cb-cicd. Unsafe for file
      paths containing spaces — prefer files-from.
    required: false
    default: ''
  files-from:
    description: >-
      Path to a newline-delimited list of changed file paths (relative to dir).
      Safe for paths with spaces; takes effect alongside (or instead of) files.
    required: false
    default: ''
  version:
    description: cb-cicd release version to download
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Download cb-cicd
      shell: bash
      run: |
        VERSION=${{ inputs.version }}
        if [ "$VERSION" = "latest" ]; then
          URL="https://github.com/clearblade/cb-cicd/releases/latest/download/cb-cicd-linux-amd64"
        else
          URL="https://github.com/clearblade/cb-cicd/releases/download/${VERSION}/cb-cicd-linux-amd64"
        fi
        curl -fsSL "$URL" -o /usr/local/bin/cb-cicd && chmod +x /usr/local/bin/cb-cicd

    - name: Sync resources
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        if [ -n "${{ inputs.files-from }}" ]; then
          cb-cicd run \
            -config "${{ inputs.config }}" \
            -files-from "${{ inputs.files-from }}" \
            ${{ inputs.files }}
        else
          cb-cicd run \
            -config "${{ inputs.config }}" \
            ${{ inputs.files }}
        fi
